<h1>今日の天気 (11-13 Fri)</h1>
<p>2026年11月13日(金)の東京地方は、<strong>一日を通して快晴</strong>となるでしょう。朝の最低気温は10℃前後と冷え込みますが、日中はたっぷりの日差しで気温はぐんぐん上がり、最高気温は18℃台まで達する見込みです。風も穏やかで、絶好のお出かけ日和となりそうです。</p>
<p>UVインデックスは最大で<strong>4（中程度）</strong>、日照時間は<strong>9時間</strong>と長く、日差しが降り注ぎます。秋とはいえ長時間紫外線を浴びると、うっすらと日焼けする可能性もあります。紫外線に敏感な方や、屋外で長時間過ごされる予定のある方は、<strong>念のため日傘や帽子、日焼け止めなどで対策されると安心です</strong>。</p>
